<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto-Like for Instagram</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Auto-Like</h1>
    <span class="count" id="count">0/20</span>
  </header>

  <p class="status" id="status">Idle</p>

  <button id="toggle" class="primary">Start</button>

  <div class="grid">
    <label for="min">Min delay</label>
    <span class="field"><input id="min" type="number" min="0.5" max="120" step="0.5" /> <em>s</em></span>

    <label for="max">Max delay</label>
    <span class="field"><input id="max" type="number" min="0.5" max="120" step="0.5" /> <em>s</em></span>

    <label for="limit">Max likes</label>
    <span class="field"><input id="limit" type="number" min="1" max="500" step="1" /></span>

    <label for="scroll">Auto-scroll feed</label>
    <span class="field"><input id="scroll" type="checkbox" /></span>
  </div>

  <footer>
    <button id="reset" class="link">Reset counter</button>
    <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">Open Instagram</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
